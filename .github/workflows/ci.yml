# 品質ゲート scripts/check.py を GitHub Actions で実行する。
# チェックの中身は check.py にだけ書き、ここには環境構築だけを書く（.claude/rules/testing.md）。
# ジョブ名 "check" は main のブランチ保護で必須のステータスチェックとして参照するため、変更しない。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # Lambda ランタイムと合わせる
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc # Node 22 系の最新（Vite 8 などは 22.12 以上が必要）
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gate
        env:
          CHECK_PYTHON: python # venv を作らず、setup-python の 3.12 を使う
        run: python scripts/check.py
